<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng Ký - TINHNGUYEN.com</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --primary-bg: #eff6ff;
            --success: #0d9488;
            --success-light: #ccfbf1;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --danger: #f43f5e;
            --danger-light: #ffe4e6;
            --dark: #0f172a;
            --light: #f8fafc;
            --border: #e2e8f0;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.2);
            overflow: hidden;
            max-width: 600px;
            width: 100%;
            border: none;
        }

        .brand-logo {
            color: var(--primary);
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -0.5px;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-register {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            color: white;
            transition: all 0.2s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 58, 138, 0.25);
            color: white;
        }

        .form-label {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .alert {
            border-radius: 10px;
            border: none;
            background-color: var(--danger-light);
            color: var(--danger);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="card register-card">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="brand-logo mb-3">
                        <i class="fas fa-hands-helping me-2 text-primary animate-bounce"></i>
                        TINH<strong>NGUYEN</strong>.com
                    </div>
                    <h3 class="text-dark fw-bold mb-1">Đăng Ký Tài Khoản</h3>
                    <p class="text-muted small">Tham gia cống hiến sức trẻ tình nguyện ngay hôm nay</p>
                </div>
                
                <div th:if="${error}" class="alert d-flex align-items-center py-3 px-4" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <div th:text="${error}">Email đã được sử dụng</div>
                </div>
                
                <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="username" class="form-label">
                                <i class="fas fa-user-circle text-primary me-1"></i> Tên đăng nhập <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="username" th:field="*{username}" 
                                   required placeholder="Nhập tên đăng nhập" minlength="3">
                        </div>

                        <div class="col-12">
                            <label for="fullName" class="form-label">
                                <i class="fas fa-user text-primary me-1"></i> Họ và tên <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}" 
                                   required placeholder="Nhập họ và tên đầy đủ của bạn">
                        </div>
                        
                        <div class="col-12">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope text-primary me-1"></i> Email <span class="text-danger">*</span>
                            </label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" 
                                   required placeholder="example@gmail.com">
                        </div>
                        
                        <div class="col-12">
                            <label for="role" class="form-label">
                                <i class="fas fa-id-badge text-primary me-1"></i> Bạn đăng ký với tư cách gì? <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" id="role" th:field="*{role}" required onchange="toggleStudentCode()">
                                <option value="STUDENT" selected>Sinh viên (Tình nguyện viên)</option>
                                <option value="ORG">Ban Tổ Chức (Đoàn, Hội, CLB...)</option>
                            </select>
                        </div>
                        
                        <div class="col-12" id="studentCodeContainer">
                            <label for="studentCode" class="form-label">
                                <i class="fas fa-id-card text-primary me-1"></i> Mã số sinh viên <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="studentCode" th:field="*{studentCode}" 
                                   placeholder="Nhập mã số sinh viên (VD: SV12345)">
                        </div>
                        
                        <div class="col-md-6">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock text-primary me-1"></i> Mật khẩu <span class="text-danger">*</span>
                            </label>
                            <input type="password" class="form-control" id="password" th:field="*{password}" 
                                   required placeholder="Tối thiểu 6 ký tự" minlength="6">
                        </div>
                        
                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label">
                                <i class="fas fa-shield-alt text-primary me-1"></i> Xác nhận mật khẩu <span class="text-danger">*</span>
                            </label>
                            <input type="password" class="form-control" id="confirmPassword" 
                                   th:field="*{confirmPassword}" required placeholder="Xác nhận lại mật khẩu">
                        </div>
                    </div>
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-register btn-lg">
                            <i class="fas fa-user-plus me-2"></i> ĐĂNG KÝ NGAY TÀI KHOẢN
                        </button>
                    </div>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <p class="mb-0 text-muted small">
                        Đã có tài khoản? 
                        <a th:href="@{/login}" class="text-decoration-none fw-bold text-primary">
                            Đăng nhập tại đây
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleStudentCode() {
            var role = document.getElementById("role").value;
            var container = document.getElementById("studentCodeContainer");
            var input = document.getElementById("studentCode");
            if (role === "STUDENT") {
                container.style.display = "block";
                input.required = true;
            } else {
                container.style.display = "none";
                input.required = false;
                input.value = "";
            }
        }
        
        // Initial check on load
        document.addEventListener("DOMContentLoaded", toggleStudentCode);
    </script>
</body>
</html>
