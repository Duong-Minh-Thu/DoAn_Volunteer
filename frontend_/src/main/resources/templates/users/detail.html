<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Chi tiết Người dùng</h2>
    <div class="card mt-3 shadow-sm">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0" th:text="${user.fullName}">Họ và tên</h4>
        </div>
        <div class="card-body">
            <p><strong>Tên đăng nhập:</strong> <span th:text="${user.username}"></span></p>
            <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
            <p><strong>Mã Sinh Viên (nếu có):</strong> <span th:text="${user.studentCode}"></span></p>
            <p><strong>Vai trò:</strong> <span class="badge bg-info text-dark" th:text="${user.role}"></span></p>
            <a href="/users" class="btn btn-secondary mt-3">Quay lại danh sách</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
