<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Danh sách Người dùng</h2>
    <a href="/" class="btn btn-secondary mb-3">Trang Chủ</a>
    <table class="table table-striped mt-3 shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tên đăng nhập</th>
            <th>Họ và Tên</th>
            <th>Email</th>
            <th>Vai trò</th>
            <th>Hành Động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.username}">username</td>
            <td th:text="${user.fullName}">Họ tên</td>
            <td th:text="${user.email}">email@example.com</td>
            <td>
                <span class="badge bg-secondary" th:text="${user.role}">ROLE_USER</span>
            </td>
            <td>
                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-sm btn-info text-white">Chi tiết</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
