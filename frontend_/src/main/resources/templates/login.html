<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng Nhập - TINHNGUYEN.com</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --primary-bg: #eff6ff;
            --success: #0d9488;
            --success-light: #ccfbf1;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --danger: #f43f5e;
            --danger-light: #ffe4e6;
            --dark: #0f172a;
            --light: #f8fafc;
            --border: #e2e8f0;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.2);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            border: none;
        }

        .brand-logo {
            color: var(--primary);
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -0.5px;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-login {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            color: white;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 58, 138, 0.25);
            color: white;
        }

        .form-label {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .alert {
            border-radius: 10px;
            border: none;
            background-color: var(--danger-light);
            color: var(--danger);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card login-card">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="brand-logo mb-3">
                        <i class="fas fa-hands-helping me-2 text-primary animate-bounce"></i>
                        TINH<strong>NGUYEN</strong>.com
                    </div>
                    <h3 class="text-dark fw-bold mb-1">Đăng Nhập</h3>
                    <p class="text-muted small">Chào mừng bạn trở lại với Hệ thống tình nguyện</p>
                </div>
                
                <!-- Error message -->
                <div th:if="${error}" class="alert d-flex align-items-center py-3 px-4" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <div th:text="${error}">Tên đăng nhập hoặc mật khẩu không chính xác</div>
                </div>
                
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="fas fa-user text-primary me-1"></i> Tên đăng nhập
                        </label>
                        <input type="text" class="form-control form-control-lg" id="username" name="username" required 
                                placeholder="Nhập tên đăng nhập">
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock text-primary me-1"></i> Mật khẩu
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" required 
                                placeholder="Nhập mật khẩu của bạn">
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-login btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i> ĐĂNG NHẬP
                        </button>
                    </div>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <p class="mb-0 text-muted small">
                        Chưa có tài khoản? 
                        <a th:href="@{/register}" class="text-decoration-none fw-bold text-primary">
                            Đăng ký ngay
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
