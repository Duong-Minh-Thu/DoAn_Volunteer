<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm/Sửa Hoạt Động - TINHNGUYEN.com</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold" th:href="@{/}">
                TINH<strong>NGUYEN</strong>.com
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Trang Chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/activities}">Quản Lý Hoạt Động</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/statistics}">Thống Kê</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/users}">
                            <i class="fas fa-users"></i> Quản Lý Người Dùng
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}">
                            <i class="fas fa-sign-out-alt"></i> Đăng Xuất
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="card-title mb-0">
                            <i class="fas fa-plus-circle"></i> <span th:text="${activity.id == null ? 'Thêm Hoạt Động Tình Nguyện Mới' : 'Cập Nhật Hoạt Động'}">Thêm Hoạt Động</span>
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Lỗi!</div>
                        
                        <form th:action="@{${activity.id == null ? '/activities/new' : '/activities/' + activity.id + '/edit'}}" th:object="${activity}" method="post">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label for="title" class="form-label fw-bold">
                                        <i class="fas fa-tag text-primary"></i> Tên hoạt động <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control form-control-lg" id="title" th:field="*{title}" required
                                           placeholder="VD: Hiến máu nhân đạo...">
                                </div>
                                
                                <div class="col-md-6">
                                    <label for="startDate" class="form-label fw-bold">
                                        <i class="fas fa-clock text-primary"></i> Ngày Bắt Đầu <span class="text-danger">*</span>
                                    </label>
                                    <input type="datetime-local" class="form-control form-control-lg" id="startDate" th:field="*{startDate}" required>
                                </div>
                                
                                <div class="col-md-6">
                                    <label for="endDate" class="form-label fw-bold">
                                        <i class="fas fa-clock text-primary"></i> Ngày Kết Thúc <span class="text-danger">*</span>
                                    </label>
                                    <input type="datetime-local" class="form-control form-control-lg" id="endDate" th:field="*{endDate}" required>
                                </div>
                                
                                <div class="col-12">
                                    <label for="location" class="form-label fw-bold">
                                        <i class="fas fa-map-marker-alt text-primary"></i> Địa điểm <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control form-control-lg" id="location" th:field="*{location}" required
                                           placeholder="VD: Trung tâm Y tế...">
                                </div>
                                
                                <div class="col-md-6">
                                    <label for="maxParticipants" class="form-label fw-bold">
                                        <i class="fas fa-users text-primary"></i> Số lượng tối đa <span class="text-danger">*</span>
                                    </label>
                                    <input type="number" class="form-control form-control-lg" id="maxParticipants" th:field="*{maxParticipants}" 
                                           required min="1" placeholder="VD: 30">
                                </div>
                                
                                <div class="col-md-6">
                                    <label for="points" class="form-label fw-bold">
                                        <i class="fas fa-star text-primary"></i> Điểm thưởng <span class="text-danger">*</span>
                                    </label>
                                    <input type="number" class="form-control form-control-lg" id="points" th:field="*{points}" 
                                           required min="1" placeholder="VD: 10">
                                </div>
                                
                                <div class="col-12">
                                    <label for="description" class="form-label fw-bold">
                                        <i class="fas fa-info-circle text-primary"></i> Mô tả chi tiết <span class="text-danger">*</span>
                                    </label>
                                    <textarea class="form-control" id="description" th:field="*{description}" rows="4" required
                                              placeholder="Mô tả chi tiết về hoạt động, yêu cầu, lưu ý..."></textarea>
                                </div>
                            </div>
                            
                            <hr class="my-4">
                            
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/activities}" class="btn btn-outline-secondary btn-lg">
                                    <i class="fas fa-arrow-left"></i> Quay lại
                                </a>
                                <div>
                                    <button type="submit" class="btn btn-success btn-lg">
                                        <i class="fas fa-save"></i> Lưu hoạt động
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
