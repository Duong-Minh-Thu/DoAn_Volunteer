<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản Lý Hoạt Động - TINHNGUYEN.com</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            color: #1976d2 !important;
            font-weight: bold;
            font-size: 18px;
        }
        .status-registered {
            background: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 11px;
        }
        .btn-sm-custom {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                TINH<strong>NGUYEN</strong>.com
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Trang Chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/activities}">Quản Lý Hoạt Động</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/registrations}">Quản Lý Đăng Ký</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/users}">
                            <i class="fas fa-users"></i> Quản Lý Người Dùng
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fas fa-sign-out-alt"></i> Đăng Xuất
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container my-4">
        
        <!-- Header -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title text-primary mb-3">
                    <i class="fas fa-heart"></i> HOẠT ĐỘNG HIỆN CÓ
                </h2>
                <div class="row g-2">
                    <div class="col-md-8">
                        <form class="d-flex">
                            <input type="text" class="form-control me-2" 
                                   placeholder="Tìm kiếm tên, địa điểm hoặc mô tả..." value="">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-search"></i>
                            </button>
                        </form>
                    </div>
                    <div class="col-md-4 text-end">
                        <a href="#" class="btn btn-success">
                            <i class="fas fa-plus"></i> Thêm hoạt động
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Activities Table -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th><i class="fas fa-calendar-alt"></i> Tên chương trình</th>
                                <th><i class="fas fa-clock"></i> ID / Trạng thái</th>
                                <th><i class="fas fa-map-marker-alt"></i> Địa điểm</th>
                                <th><i class="fas fa-users"></i> SL Tối đa</th>
                                <th><i class="fas fa-star"></i> Điểm số</th>
                                <th><i class="fas fa-info-circle"></i> Mô tả</th>
                                <th><i class="fas fa-cogs"></i> Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="activity : ${activities}">
                                <td><strong class="text-primary" th:text="${activity.title}">Tiêu đề</strong></td>
                                <td>
                                    ID: <span th:text="${activity.id}">1</span> <br>
                                    <span class="badge bg-info" th:text="${activity.status}">UPCOMING</span>
                                </td>
                                <td><i class="fas fa-map-marker-alt text-muted"></i> <span th:text="${activity.location}">Địa điểm</span></td>
                                <td><span class="badge bg-secondary" th:text="${activity.maxParticipants}">50</span></td>
                                <td><span class="badge bg-success"><i class="fas fa-star"></i> <span th:text="${activity.points}">10</span></span></td>
                                <td class="text-truncate" style="max-width: 200px;" th:text="${activity.description}">Mô tả ngắn gọn</td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/activities/{id}(id=${activity.id})}" class="btn btn-info btn-sm-custom text-white">
                                            <i class="fas fa-eye"></i> Chi tiết
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
