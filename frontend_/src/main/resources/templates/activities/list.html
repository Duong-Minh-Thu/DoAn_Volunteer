<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Hoạt động</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Danh sách Hoạt động Tình nguyện</h2>
    <a href="/" class="btn btn-secondary mb-3">Trang Chủ</a>
    <table class="table table-striped mt-3 shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tên Hoạt Động</th>
            <th>Tổ Chức</th>
            <th>Địa Điểm</th>
            <th>Điểm</th>
            <th>Trạng Thái</th>
            <th>Hành Động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="activity : ${activities}">
            <td th:text="${activity.id}">1</td>
            <td th:text="${activity.title}">Tiêu đề</td>
            <td th:text="${activity.orgName}">Tổ chức</td>
            <td th:text="${activity.location}">Địa điểm</td>
            <td th:text="${activity.points}">0</td>
            <td>
                <span class="badge bg-success" th:text="${activity.status}">UPCOMING</span>
            </td>
            <td>
                <a th:href="@{/activities/{id}(id=${activity.id})}" class="btn btn-sm btn-info text-white">Chi tiết</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
