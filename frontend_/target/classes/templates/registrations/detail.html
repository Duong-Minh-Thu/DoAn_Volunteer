<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Chi tiết Đăng ký</h2>
    <div class="card mt-3 shadow-sm">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0">Mã đăng ký: <span th:text="${registration.id}"></span></h4>
        </div>
        <div class="card-body">
            <p><strong>ID Hoạt động:</strong> <span th:text="${registration.activityId}"></span></p>
            <p><strong>ID Sinh viên:</strong> <span th:text="${registration.studentId}"></span></p>
            <p><strong>Ngày đăng ký:</strong> <span th:text="${registration.registeredAt}"></span></p>
            <p><strong>Trạng thái hiện tại:</strong> <span class="badge bg-info text-dark" th:text="${registration.status}"></span></p>
            
            <a href="/registrations" class="btn btn-secondary mt-3">Quay lại danh sách</a>
            <button class="btn btn-success mt-3">Duyệt đăng ký</button>
            <button class="btn btn-danger mt-3">Hủy</button>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
