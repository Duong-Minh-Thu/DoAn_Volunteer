<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Danh sách Đăng ký Hoạt động</h2>
    <a href="/" class="btn btn-secondary mb-3">Trang Chủ</a>
    <table class="table table-striped mt-3 shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID Đăng ký</th>
            <th>ID Hoạt động</th>
            <th>ID Sinh viên</th>
            <th>Trạng thái</th>
            <th>Ngày đăng ký</th>
            <th>Hành Động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="reg : ${registrations}">
            <td th:text="${reg.id}">1</td>
            <td th:text="${reg.activityId}">10</td>
            <td th:text="${reg.studentId}">5</td>
            <td>
                <span class="badge bg-warning text-dark" th:text="${reg.status}">PENDING</span>
            </td>
            <td th:text="${reg.registeredAt}">2026-05-14</td>
            <td>
                <a th:href="@{/registrations/{id}(id=${reg.id})}" class="btn btn-sm btn-info text-white">Chi tiết</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
