<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Hoạt động</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Chi tiết Hoạt động</h2>
    <div class="card mt-3 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${activity.title}">Tên hoạt động</h4>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Tổ chức:</strong> <span th:text="${activity.orgName}"></span></p>
                    <p><strong>Địa điểm:</strong> <span th:text="${activity.location}"></span></p>
                    <p><strong>Trạng thái:</strong> <span th:text="${activity.status}" class="badge bg-success"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Điểm rèn luyện:</strong> <span th:text="${activity.points}"></span></p>
                    <p><strong>Số lượng tối đa:</strong> <span th:text="${activity.maxParticipants}"></span></p>
                </div>
            </div>
            <hr>
            <p><strong>Mô tả:</strong> <span th:text="${activity.description}"></span></p>
            <a href="/activities" class="btn btn-secondary mt-3">Quay lại danh sách</a>
            <button class="btn btn-primary mt-3">Đăng ký tham gia</button>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
